<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Laudo — coleta em campo</title>
<style>
  :root { --bg:#f3f5f8; --card:#fff; --ink:#1d2733; --muted:#5d6b7a; --line:#d3dae3; --brand:#1a5fb4; --brand-d:#144a8f; --err:#c0392b; --ok:#1e8449; --warn:#b7791f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body { font:17px/1.45 Roboto, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--ink); overscroll-behavior-y:contain; }
  header.top { position:sticky; top:0; z-index:20; background:var(--brand); color:#fff; padding:10px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header.top h1 { font-size:18px; margin:0; flex:1 1 200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header.top .st { font-size:13px; opacity:.9; }
  header.top button { font:inherit; font-weight:600; min-height:44px; padding:8px 14px; border-radius:8px; border:0; background:#fff; color:var(--brand); }
  main { max-width:980px; margin:0 auto; padding:14px; padding-bottom:110px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { margin:0 0 12px; font-size:18px; color:var(--brand-d); }
  .card h3 { margin:18px 0 8px; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; border-bottom:1px solid var(--line); padding-bottom:6px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; }
  .card h3 select { font:15px inherit; text-transform:none; letter-spacing:0; min-height:40px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }
  .btn { font:inherit; font-weight:600; min-height:48px; padding:10px 18px; border-radius:10px; border:1px solid var(--brand); background:#fff; color:var(--brand); }
  .btn.primary { background:var(--brand); color:#fff; }
  .btn.danger { border-color:var(--err); color:var(--err); }
  .btn.small { min-height:40px; padding:6px 12px; font-size:15px; }
  .btn:disabled { opacity:.5; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .hint { color:var(--muted); font-size:14px; margin:4px 0 8px; }
  .msg { padding:12px 14px; border-radius:10px; margin-bottom:12px; }
  .msg.err { background:#fdecea; color:#8e2318; border:1px solid #f5c2bb; }
  .msg.ok { background:#e9f7ef; color:#165d33; border:1px solid #b9e2c9; }
  .msg.warn { background:#fff8e5; color:#7a5b00; border:1px solid #f0dc9b; }
  .msg .row { margin-top:8px; }
  input[type=text], input[type=password], input[type=date], textarea, select.f { width:100%; min-height:48px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:#fff; color:var(--ink); }
  textarea { min-height:52px; resize:vertical; }
  textarea.big { min-height:130px; }
  .field { margin-bottom:16px; padding:8px; border-radius:8px; border-left:4px solid transparent; }
  .field.missing { border-left-color:var(--err); }
  .field.preset { border-left-color:var(--warn); background:#fffaf0; }
  .field > label.t { display:block; font-weight:600; margin-bottom:6px; }
  .req { color:var(--err); }
  .opts { display:flex; flex-direction:column; }
  .opts.inline { flex-direction:row; flex-wrap:wrap; gap:0 8px; }
  .opts label { display:flex; gap:12px; align-items:flex-start; padding:11px 8px; border-radius:8px; font-weight:400; }
  .opts label:active { background:#e8f0fb; }
  .opts input[type=radio], .opts input[type=checkbox], .chk input { width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:var(--brand); }
  .opts .other { display:flex; gap:6px; align-items:flex-start; }
  .opts .other textarea { flex:1; margin-top:4px; }
  .chk { display:flex; gap:10px; align-items:center; padding:8px 0; }
  .clear { font:inherit; font-size:14px; color:var(--muted); background:none; border:0; text-decoration:underline; padding:8px 4px; }
  /* navegação por seções */
  nav.steps { position:sticky; top:64px; z-index:15; background:var(--bg); display:flex; gap:6px; overflow-x:auto; padding:8px 0 10px; margin-bottom:6px; }
  nav.steps button { flex:none; font:inherit; font-size:14px; min-height:42px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink); white-space:nowrap; }
  nav.steps button.cur { background:var(--brand); color:#fff; border-color:var(--brand); }
  nav.steps button .n { display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; border-radius:10px; font-size:12px; background:var(--err); color:#fff; }
  nav.steps button.done::after { content:" ✓"; color:var(--ok); font-weight:700; }
  nav.steps button.cur.done::after { color:#fff; }
  .sec { display:none; } .sec.cur { display:block; }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:20; background:#fff; border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .bar .info { font-size:13px; color:var(--muted); flex:1; text-align:center; }
  /* lista de casos */
  .case { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 0; border-top:1px solid var(--line); }
  .case:first-of-type { border-top:0; }
  .case .lbl { flex:1 1 260px; font-weight:600; }
  .tag { display:inline-block; font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px; margin-left:6px; background:#e8edf3; color:var(--muted); }
  .tag.pend { background:#fdecea; color:#8e2318; } .tag.ok { background:#e9f7ef; color:#165d33; }
  /* caneta */
  .modes { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:0 0 6px; }
  .modes button { font:inherit; font-size:15px; min-height:40px; padding:6px 14px; border:0; background:#fff; color:var(--ink); }
  .modes button.on { background:var(--brand); color:#fff; }
  .inkbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0; }
  .inkbar button { font:inherit; font-size:15px; min-height:42px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .inkbar button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .inkbar .pg { font-size:14px; color:var(--muted); min-width:74px; text-align:center; }
  canvas.ink { display:block; width:100%; background:#fff; border:1px solid var(--line); border-radius:6px; touch-action:none;
    background-image:linear-gradient(#e6ecf3 1px, transparent 1px); background-size:100% 4.2%; }
  .q { border:1px solid var(--line); border-radius:10px; padding:10px; margin:8px 0; background:#fafbfc; }
  .q .topq { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .q .topq select { font:inherit; min-height:42px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .q textarea { margin-bottom:6px; }
  .sug { display:flex; flex-direction:column; gap:4px; margin-top:6px; }
  .sug button { text-align:left; font:inherit; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#f8fafc; }
  .center { max-width:460px; margin:8vh auto 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
